# Reiner Pruef-Lauf: Tests und Build, kein Deploy.
#
# Der Nutzen liegt nicht darin, dass die Tests laufen — die muessen laut
# CLAUDE.md vor jedem Commit lokal gruen sein. Er liegt im *frischen Klon*:
# hier baut nur, was wirklich in Git liegt. Eine vergessene, nicht getrackte
# Datei ist lokal unsichtbar und faellt genau an dieser Stelle auf.
#
# Kein Release-Schritt: das ZIP wird hier nur zur Probe gepackt und verworfen,
# das echte entsteht ueber `/release` lokal; der Upload in den Chrome Web Store
# laeuft ueber `npm run store:publish` mit Zugangsdaten, die CI nie sieht
# (store/PUBLISHING.md).
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

# Nichts wird geschrieben, kein Secret gebraucht: die Tests kommen ohne Netz
# und ohne Server aus.
permissions:
  contents: read

jobs:
  test:
    name: Tests + Build (Node ${{ matrix.node }})
    runs-on: ubuntu-latest
    timeout-minutes: 5

    strategy:
      # Ein Bruch auf einer Version soll die andere trotzdem zu Ende laufen
      # lassen — sonst weiss man nicht, ob es die Version war oder der Code.
      fail-fast: false
      matrix:
        # Untergrenze aus `engines` und aktuelles LTS. Was dazwischen liegt,
        # bringt keinen zusaetzlichen Befund.
        node: ['22', '24']

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: ${{ matrix.node }}
          cache: npm

      # `npm ci` statt `npm install`: schlaegt an, wenn package-lock.json nicht
      # zu package.json passt.
      - run: npm ci

      # Das `test`-Skript uebergibt `test/*.test.js` UNGEQUOTET — die Shell
      # loest den Stern auf, nicht Node. Ein gequoteter `**`-Ausdruck kann das
      # erst ab Node 22 selbst; auf Node 20 endete er in „Could not find" und
      # genau diese Zeile war ueber sechs Releases hinweg rot, waehrend die
      # Node-24-Spalte gruen blieb. Folge der Shell-Variante: ein Test in einem
      # UNTERverzeichnis von test/ liefe nicht mit — heute liegt keiner dort.
      - run: npm test

      # JSDoc-Typen gegen den Code pruefen (`checkJs`, siehe jsconfig.json).
      # Erzeugt nichts; faengt vor allem Feldnamen, die nicht mehr stimmen.
      - run: npm run typecheck

      # Baut nach dist/. Faengt fehlende Importe und nicht getrackte Dateien,
      # die die Tests nicht beruehren.
      - run: npm run build

      # Packt zur Probe (baut dabei erneut, das Skript ist `build && package`).
      # Laesst die Pruefungen aus tools/package.mjs greifen, die sonst erst
      # beim Release anschlagen: Versionsgleichstand manifest/package.json,
      # Store-taugliche Versionsnummer, keine Sourcemaps oder versteckten
      # Dateien im Paket. Braucht weder Netz noch Geheimnisse; das ZIP wird
      # nicht hochgeladen und verfaellt mit dem Runner.
      - run: npm run package
